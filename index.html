<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>BookCreator</title><style>body{margin:0;background:#f5f4fb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#17152b}.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}header{padding:20px 22px;border-bottom:1px solid #eee;display:flex;justify-content:space-between}.logo{font-weight:800}.step{color:#777;font-size:13px}main{padding:24px}.screen{display:none}.active{display:block}.eyebrow{font-size:12px;font-weight:800;color:#6d5bd0;letter-spacing:.1em}h1{font-size:31px;margin:9px 0}.lead{color:#68657b;line-height:1.5}.primary,.choice,.secondary{width:100%;border-radius:16px;padding:16px;margin:8px 0;border:0;font:inherit}.primary{background:#6d5bd0;color:white;font-weight:800}.secondary{background:#f3f1fb;color:#292442}.choice{text-align:left;background:#f7f6fb}.choice small,.choice b{display:block}.choice small{color:#777;margin-top:5px}.selected{outline:2px solid #6d5bd0}.back{border:0;background:none;color:#6d5bd0;padding:0;margin-bottom:20px}label{display:block;font-weight:700;margin:18px 0 7px}input,textarea,select{width:100%;box-sizing:border-box;padding:14px;border:1px solid #ddd9ec;border-radius:14px;font:inherit}textarea{min-height:100px}.book{border:1px solid #eee;border-radius:18px;padding:16px;margin-top:20px}.status{padding:12px 0;border-bottom:1px solid #eee}.chapter{display:flex;gap:10px;align-items:center;background:#f8f7fc;border:1px solid #ece9f5;border-radius:14px;padding:10px;margin:9px 0}.chapter input{border:0;background:transparent;padding:8px;font-weight:650}.chapter button{border:0;background:none;font-size:20px}.editor{min-height:500px;line-height:1.5}</style></head><body><div class="app"><header><div class="logo">✦ BookCreator</div><div id="step">Start</div></header><main><section id="home" class="screen active"><h1>Moje książki</h1><p class="lead">Twórz książki z własnych materiałów — krok po kroku.</p><button class="primary" onclick="go('setup','Krok 1 z 5')">＋ Nowy e-book</button></section><section id="setup" class="screen"><button class="back" onclick="go('home','Start')">← Wróć</button><h1>Utwórz nową książkę</h1><label>Tytuł</label><input id="bookTitle"><label>O czym jest książka?</label><textarea id="topic"></textarea><label>Język</label><select id="language"><option>Polski</option><option>English</option><option>Svenska</option></select><label>Dla kogo?</label><input id="audience"><button class="primary" onclick="go('style','Krok 2 z 5')">Dalej →</button></section><section id="style" class="screen"><button class="back" onclick="go('setup','Krok 1 z 5')">← Wróć</button><h1>Wybierz styl pisania</h1><button class="choice selected"><b>Prosty i naturalny</b></button><button class="choice"><b>Poetycki i refleksyjny</b></button><button class="choice"><b>Motywacyjny</b></button><button class="choice"><b>Mój własny styl</b></button><button class="primary" onclick="go('materials','Krok 3 z 5')">Dalej →</button></section><section id="materials" class="screen"><button class="back" onclick="go('style','Krok 2 z 5')">← Wróć</button><h1>Dodaj materiały</h1><textarea id="materialsText" placeholder="Wklej tekst, notatki lub pomysły…"></textarea><button class="primary" onclick="go('analysis','Krok 4 z 5')">Dalej →</button></section><section id="analysis" class="screen"><button class="back" onclick="go('materials','Krok 3 z 5')">← Wróć</button><h1>Materiały gotowe</h1><div class="status">✓ Tekst zapisany</div><div class="status">✓ Gotowe do generowania</div><button class="primary" onclick="go('outline','Krok 5 z 5')">Zobacz spis treści →</button></section><section id="outline" class="screen"><button class="back" onclick="go('analysis','Krok 4 z 5')">← Wróć</button><h1>Spis treści</h1><div id="chapters"><div class="chapter"><input value="Wstęp — dlaczego warto zacząć teraz"><button onclick="this.parentElement.remove()">×</button></div><div class="chapter"><input value="1. Punkt wyjścia — gdzie jesteś dzisiaj"><button onclick="this.parentElement.remove()">×</button></div><div class="chapter"><input value="2. Wizja — dokąd naprawdę chcesz dojść"><button onclick="this.parentElement.remove()">×</button></div><div class="chapter"><input value="3. Zmiana sposobu myślenia"><button onclick="this.parentElement.remove()">×</button></div><div class="chapter"><input value="4. Codzienne nawyki i działanie"><button onclick="this.parentElement.remove()">×</button></div><div class="chapter"><input value="5. Jak utrzymać zmianę"><button onclick="this.parentElement.remove()">×</button></div><div class="chapter"><input value="Zakończenie — Twój następny krok"><button onclick="this.parentElement.remove()">×</button></div></div><button class="secondary" onclick="addChapter()">＋ Dodaj rozdział</button><button id="gen" class="primary" onclick="generateBook()">✨ Generuj treść książki</button><p id="error"></p></section><section id="editor" class="screen"><button class="back" onclick="go('outline','Krok 5 z 5')">← Wróć</button><h1>Treść książki</h1><textarea id="bookContent" class="editor"></textarea><button class="secondary" onclick="navigator.clipboard.writeText(bookContent.value)">Kopiuj tekst</button></section></main></div><script>function go(id,label){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');step.textContent=label;scrollTo(0,0)}document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});function addChapter(){let d=document.createElement('div');d.className='chapter';d.innerHTML='<input value="Nowy rozdział"><button onclick="this.parentElement.remove()">×</button>';chapters.appendChild(d)}async function generateBook(){gen.disabled=true;gen.textContent='AI pisze książkę…';error.textContent='';try{let r=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:bookTitle.value,topic:topic.value,audience:audience.value,language:language.value,style:document.querySelector('.choice.selected b').textContent,materials:materialsText.value,chapters:[...document.querySelectorAll('#chapters input')].map(x=>x.value)})});let d=await r.json();if(!r.ok)throw Error(d.error||'Błąd');bookContent.value=d.text;go('editor','Edytor')}catch(e){error.textContent=e.message}finally{gen.disabled=false;gen.textContent='✨ Generuj treść książki'}} </script></body></html>
